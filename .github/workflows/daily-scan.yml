# Rescans the whole S&P 500 and rebuilds the public page once per trading
# day, an hour after the US close, then commits the result. GitHub Pages
# serves docs/ straight from main, so the commit IS the deploy.

name: Daily scan

on:
  schedule:
    # GitHub cron is UTC ONLY and does not observe daylight saving, so no
    # single expression stays at 17:00 New York year-round. Both fire; the
    # gate below decides which one actually scans.
    - cron: "0 21 * * 1-5"    # 17:00 America/New_York while EDT
    - cron: "0 22 * * 1-5"    # 17:00 America/New_York while EST
    # TEMPORARY PROBE — added 30 Aug 2026 10:50 UTC, REMOVE BY 31 Aug 2026.
    # The daily schedule has never been observed to fire on its own; every
    # run so far came from a manual dispatch. An earlier */10 probe saw
    # nothing in 33 minutes, which is too short to tell "never fires" from
    # "fires late" — GitHub delays scheduled runs under load.
    #
    # This is cheap to leave running: the gate below is state-based, so a
    # firing on a day already scanned exits in seconds without touching
    # EDGAR. What it proves is the only thing in question — whether GitHub
    # triggers this workflow at all.
    - cron: "*/15 * * * *"
  workflow_dispatch:          # manual run from the Actions tab

permissions:
  contents: write             # to commit the refreshed scan and page

concurrency:
  group: daily-scan
  cancel-in-progress: false   # never interrupt a scan mid-flight

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45       # Stage 1 walks 470 EDGAR filings at ~0.11s each

    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this run should scan
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, sys
          from datetime import datetime, timezone, timedelta

          log = lambda m: print(m, file=sys.stderr)

          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              log("Manual run — proceeding.")
              print("proceed=true"); raise SystemExit

          # GATE ON STATE, NOT ON THE CLOCK.
          #
          # It is tempting to check "is it 17:00 in New York?" and skip
          # otherwise. That silently breaks the whole schedule, because
          # GitHub does not guarantee scheduled runs fire on time — under
          # load they are delayed by hours or dropped entirely. A run
          # scheduled for 21:00 UTC can execute at 05:00 UTC, by which
          # point New York reads 01:00, an hour check rejects it, and the
          # job exits having done nothing while reporting SUCCESS. The
          # page then goes quietly stale with a green tick in the Actions
          # tab.
          #
          # Asking "has today's scan already happened?" instead is true or
          # false regardless of when the runner happens to wake up.
          NY = timezone(timedelta(hours=-4))   # see note below
          # America/New_York needs tzdata, which is not guaranteed on every
          # runner image. The exact offset does not matter here: this only
          # derives a DATE and asks whether 16:00 local has passed. An hour
          # of drift cannot change either answer except within one hour of
          # midnight, which the "two or more days behind" rule below picks
          # up on the next run anyway.
          now = datetime.now(timezone.utc).astimezone(NY)

          scan = pathlib.Path("docs/scan.json")
          if not scan.exists():
              log("No previous scan recorded — proceeding.")
              print("proceed=true"); raise SystemExit

          state = json.loads(scan.read_text())
          last = datetime.fromisoformat(state["generated_utc"]).astimezone(NY)
          days_behind = (now.date() - last.date()).days
          log(f"last scan {last.date()} · now {now.date()} {now:%H:%M} local "
              f"· {days_behind} days behind")

          if days_behind <= 0:
              proceed, why = False, "already scanned today"
          elif days_behind == 1 and now.hour < 16:
              # One day behind but today's close has not happened, so there
              # is genuinely nothing newer to fetch. Catches a run delayed
              # into the small hours of the next morning.
              proceed, why = False, "today's close has not happened yet"
          else:
              proceed, why = True, "behind, and a newer close is available"

          log(f"decision: {'PROCEED' if proceed else 'SKIP'} — {why}")
          print(f"proceed={'true' if proceed else 'false'}")
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      - name: Stage 1 — quality gate on SEC filings
        if: steps.gate.outputs.proceed == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "SEC_USER_AGENT secret is not set. The SEC rejects"
            echo "anonymous callers, so the scan cannot run without it."
            exit 1
          fi
          python scripts/run_stage1.py

      - name: Stage 2 — how far below normal
        if: steps.gate.outputs.proceed == 'true'
        run: python scripts/run_stage2.py

      # Stage 3 ANNOTATES the ranking; it never reorders or filters it.
      # continue-on-error because build_site degrades to no annotation if
      # the results file is missing: a Stage 3 outage must not stop the
      # page refreshing with current prices and gates.
      - name: Stage 3 — opportunity or warning
        if: steps.gate.outputs.proceed == 'true'
        continue-on-error: true
        env:
          # Stage 3 reads EDGAR exactly as Stage 1 does and needs the same
          # contact header. It was missing here from the day Stage 3
          # shipped, so run_stage3.py died on its first request in EVERY
          # CI run. Nobody noticed because scripts/*_results.json are
          # gitignored and the page was being rebuilt locally, where the
          # variable is set — so the committed page always carried Stage 3
          # data that CI had never produced.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/run_stage3.py

      # BEFORE the gate, and if: always(). The results files are gitignored,
      # so they never leave the runner — when the doc-currency gate below
      # refuses to publish, an eight-minute scan of 500 companies is
      # discarded along with the only record of WHICH companies moved.
      # That happened twice on 30 Aug. The second time was worse than
      # losing the data: the local copies were stale, so a diff compared
      # two old files and reported "nothing changed" when five tiers had.
      - name: Keep the scan output, whatever happens next
        if: always() && steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: scripts/*_results.json
          retention-days: 14
          if-no-files-found: warn

      - name: Refuse to publish a bad scan
        if: steps.gate.outputs.proceed == 'true'
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          # A partial scan must never reach the page. Both sources can fail
          # softly — EDGAR rate-limits, and Yahoo can return empty frames —
          # so check the SHAPE of the result, not just that a file exists.
          s1 = json.loads(pathlib.Path("scripts/stage1_results.json").read_text())
          s2 = json.loads(pathlib.Path("scripts/stage2_results.json").read_text())
          # Stage 3 is continue-on-error, so a crash there is silent by
          # design. The guard is what makes it loud: on 30 Aug a missing
          # SEC_USER_AGENT emptied Stage 3 for all 470 companies and this
          # check did not exist, so a page with one column entirely blank
          # was published.
          s3p = pathlib.Path("scripts/stage3_results.json")
          s3 = json.loads(s3p.read_text()) if s3p.exists() else {}

          # Must match funnel ELIGIBLE_TIERS. This also counted an
          # EXCEPTION tier that spec v2.3 removed from the funnel; no
          # company can carry it any more.
          eligible = sum(1 for r in s1.values()
                         if r["tier"] in {"PASS","BORDERLINE"})
          priced   = sum(1 for r in s2.values() if r.get("status") == "scored")

          problems = []
          if len(s1) < 450:  problems.append(f"only {len(s1)} companies gated")
          if eligible < 150: problems.append(f"only {eligible} eligible — gate looks broken")
          if eligible > 400: problems.append(f"{eligible} eligible — gate is not gating")
          if priced < 450:   problems.append(f"only {priced} companies priced")

          # Six eligible companies legitimately have no cheapness reading
          # (spec §5.3), so this floors on coverage rather than demanding
          # every one. Zero means the stage did not run.
          elig_t = {t for t, r in s1.items()
                    if r["tier"] in {"PASS","BORDERLINE"}}
          read = sum(1 for t in elig_t if (s3.get(t) or {}).get("cheap"))
          if read < eligible * 0.80:
              problems.append(f"only {read} of {eligible} eligible have a "
                              f"Stage 3 reading — the stage looks broken")

          for p in problems: print("FAIL:", p)
          if problems:
              sys.exit("Refusing to publish. Previous page left in place.")
          print(f"ok — {len(s1)} gated, {eligible} eligible, {priced} priced, "
                f"{read} read for cheapness")
          PY

      - name: Rebuild the page
        if: steps.gate.outputs.proceed == 'true'
        run: |
          # build_site.py writes docs/scan.json as well as the page, so the
          # gate's state and the published numbers come from one run and
          # cannot drift apart.
          python scripts/build_site.py

      # Every documentation failure in this project has been a document
      # asserting a fact the data had since changed. A stale sentence
      # reads exactly like a fresh one, so this compares them instead.
      - name: Do the documents still describe the code?
        if: steps.gate.outputs.proceed == 'true'
        run: python tests/test_docs_current.py

      - name: Commit and push, but only if the numbers moved
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # scan.json changes on every run because it carries a timestamp,
          # so comparing it would commit daily even on market holidays when
          # nothing actually moved. Judge on the PAGE instead: if the
          # rendered table is identical, there is nothing to publish.
          # Both pages are rendered from the same scan by the same run, so
          # either one moving means the day produced something new.
          if git diff --quiet -- docs/index.html docs/simple/index.html \
             && [ -z "$(git status --porcelain -- docs/simple/index.html)" ]; then
            echo "Pages are unchanged (holiday, or prices did not move) — nothing to commit."
            exit 0
          fi

          git add docs/index.html docs/simple/index.html docs/scan.json
          git commit -m "Refresh scan ($(TZ=America/New_York date '+%Y-%m-%d'))"
          git push
